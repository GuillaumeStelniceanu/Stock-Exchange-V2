<!-- templates/components/search_bar.html -->
<div class="search-bar-component">

    <!-- Input wrapper -->
    <div class="sb-wrapper" onclick="this.querySelector('.sb-input').focus()" style="
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        height: 60px;
        background: var(--bg-card, #1a1f2e);
        border: 2px solid var(--border, rgba(255,255,255,0.08));
        border-radius: 1rem;
        transition: border-color 0.3s, box-shadow 0.3s;
        cursor: text;
    ">
        <!-- Icon -->
        <span class="sb-icon" style="
            flex-shrink: 0;
            padding: 0 0.875rem 0 1.25rem;
            color: #6b7280;
            font-size: 1rem;
            pointer-events: none;
            transition: opacity 0.15s, max-width 0.15s, padding 0.15s;
            max-width: 52px;
            overflow: hidden;
        "><i class="fas fa-search"></i></span>

        <!-- Input -->
        <input
            type="text"
            class="sb-input"
            placeholder="Rechercher une action (ex: AAPL, MSFT, TTE.PA)..."
            autocomplete="off"
            style="
                flex: 1 1 auto;
                min-width: 0;
                height: 100%;
                padding: 0 1.25rem 0 0.25rem;
                font-family: 'JetBrains Mono', monospace;
                font-size: 0.9375rem;
                font-weight: 500;
                background: transparent;
                border: none;
                outline: none;
                color: var(--text-primary, #e8eaed);
                cursor: text;
            "
        >
    </div>

    <!-- Quick actions -->
    <div class="search-quick-actions">
        <span class="quick-label">Actions populaires:</span>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=AAPL'"><i class="fab fa-apple"></i> AAPL</button>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=MSFT'"><i class="fab fa-microsoft"></i> MSFT</button>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=GOOGL'"><i class="fab fa-google"></i> GOOGL</button>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=TSLA'"><i class="fas fa-car"></i> TSLA</button>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=TTE.PA'"><i class="fas fa-gas-pump"></i> TTE</button>
    </div>
</div>

<script>
(function () {
    var scripts = document.querySelectorAll('script');
    var thisScript = scripts[scripts.length - 1];
    var component = thisScript.previousElementSibling;

    var wrapper = component.querySelector('.sb-wrapper');
    var input   = component.querySelector('.sb-input');
    var icon    = component.querySelector('.sb-icon');

    if (!input || !wrapper) return;

    /* Create dropdown portaled to body */
    var drop = document.createElement('div');
    drop.className = 'sb-dropdown-portal';
    drop.style.cssText = 'display:none;position:fixed;z-index:99999;background:rgb(10,17,32);'
                       + 'border:1px solid rgba(0,102,255,0.5);border-radius:0.875rem;overflow:hidden;'
                       + 'box-shadow:0 20px 60px rgba(0,0,0,1);max-height:520px;overflow-y:auto;';
    document.body.appendChild(drop);

    function positionDrop() {
        var rect = wrapper.getBoundingClientRect();
        drop.style.top   = (rect.bottom + 8) + 'px';
        drop.style.left  = rect.left + 'px';
        drop.style.width = rect.width + 'px';
    }

    var rafId = null;
    function keepPositioned() {
        if (drop.style.display !== 'none') {
            positionDrop();
            rafId = requestAnimationFrame(keepPositioned);
        }
    }

    input.addEventListener('focus', function () {
        wrapper.style.borderColor = '#0066FF';
        wrapper.style.boxShadow   = '0 0 0 4px rgba(0,102,255,0.12)';
    });
    input.addEventListener('blur', function () {
        setTimeout(function () {
            wrapper.style.borderColor = '';
            wrapper.style.boxShadow   = '';
        }, 150);
    });

    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            var t = input.value.trim().toUpperCase();
            if (t) window.location.href = '/analyse?ticker=' + t;
        }
    });

    input.addEventListener('input', function () {
        var hasText = input.value.length > 0;
        icon.style.opacity  = hasText ? '0' : '1';
        icon.style.maxWidth = hasText ? '0' : '52px';
        icon.style.padding  = hasText ? '0' : '';

        var q = input.value.trim();
        if (q.length < 2) { closeDrop(); return; }

        clearTimeout(input._searchTimer);
        input._searchTimer = setTimeout(function () {
            fetch('/api/search?q=' + encodeURIComponent(q))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var items = data.suggestions || [];
                    items.length ? renderDrop(items) : emptyDrop(q);
                })
                .catch(closeDrop);
        }, 260);
    });

    function renderDrop(items) {
        var html = '<div style="padding:0.5rem 1.125rem;font-size:0.65rem;font-weight:700;'
                 + 'letter-spacing:0.1em;text-transform:uppercase;color:#475569;'
                 + 'border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);">'
                 + items.length + ' résultat' + (items.length > 1 ? 's' : '') + '</div>';

        items.slice(0, 8).forEach(function (item) {
            var sym = item.ticker || item.symbol || '';
            var name = item.name || '';
            var mkt = item.market || 'US';
            var isEU = mkt === 'EU';
            var badgeBg  = isEU ? 'rgba(0,217,255,0.12)' : 'rgba(0,102,255,0.12)';
            var badgeCol = isEU ? '#00d9ff' : '#4d8ff5';
            var badgeBdr = isEU ? 'rgba(0,217,255,0.25)' : 'rgba(0,102,255,0.25)';

            html += '<div onclick="window.location.href=\'/analyse?ticker=' + sym + '\'"'
                  + ' style="display:flex;align-items:center;gap:1rem;padding:0.875rem 1.125rem;'
                  + 'cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);'
                  + 'transition:background 0.15s;" '
                  + 'onmouseover="this.style.background=\'rgba(0,102,255,0.08)\'" '
                  + 'onmouseout="this.style.background=\'\'">'
                  + '<div style="flex:1;min-width:0;">'
                  + '<div style="font-family:JetBrains Mono,monospace;font-size:1rem;font-weight:700;'
                  + 'color:#f1f5f9;line-height:1.2;">' + sym + '</div>'
                  + '<div style="font-size:0.875rem;color:#64748b;margin-top:2px;'
                  + 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + name + '</div>'
                  + '</div>'
                  + '<span style="flex-shrink:0;font-family:JetBrains Mono,monospace;font-size:0.75rem;'
                  + 'font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:4px 11px;'
                  + 'border-radius:6px;background:' + badgeBg + ';color:' + badgeCol + ';'
                  + 'border:1px solid ' + badgeBdr + ';">' + mkt + '</span>'
                  + '<i class="fas fa-chevron-right" style="flex-shrink:0;color:rgba(255,255,255,0.2);font-size:0.75rem;"></i>'
                  + '</div>';
        });

        drop.innerHTML = html;
        drop.style.display = 'block';
        if (!rafId) keepPositioned();
    }

    function emptyDrop(q) {
        drop.innerHTML = '<div style="padding:1.75rem;text-align:center;color:#64748b;font-size:0.9375rem;">'
                       + '<i class="fas fa-search" style="margin-right:0.5rem;opacity:0.3;"></i>'
                       + 'Aucun résultat pour <strong style="color:#94a3b8;">"' + q + '"</strong></div>';
        drop.style.display = 'block';
        if (!rafId) keepPositioned();
    }

    function closeDrop() {
        drop.style.display = 'none';
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    }

    document.addEventListener('click', function (e) {
        if (!component.contains(e.target) && !drop.contains(e.target)) closeDrop();
    });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeDrop();
    });

    window.addEventListener('beforeunload', function () {
        if (drop && drop.parentNode) drop.parentNode.removeChild(drop);
    });
})();
</script>
