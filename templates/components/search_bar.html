<!-- templates/components/search_bar.html -->
<div class="search-bar-component" id="search-bar-root">

    <!-- ── Input row — no button ── -->
    <div id="search-wrapper" onclick="document.getElementById('search-input').focus()" style="
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        height: 60px;
        background: var(--bg-card, #1a1f2e);
        border: 2px solid var(--border, rgba(255,255,255,0.08));
        border-radius: 1rem;
        transition: border-color 0.3s, box-shadow 0.3s;
        cursor: text;
    ">
        <!-- Loupe — hides when typing -->
        <span id="sb-icon" style="
            flex-shrink: 0;
            padding: 0 0.875rem 0 1.25rem;
            color: #6b7280;
            font-size: 1rem;
            pointer-events: none;
            transition: opacity 0.15s, max-width 0.15s, padding 0.15s;
            max-width: 52px;
            overflow: hidden;
        "><i class="fas fa-search"></i></span>

        <!-- Input takes full width -->
        <input
            type="text"
            id="search-input"
            placeholder="Rechercher une action (ex: AAPL, MSFT, TTE.PA)..."
            autocomplete="off"
            style="
                flex: 1 1 auto;
                min-width: 0;
                height: 100%;
                padding: 0 1.25rem 0 0.25rem;
                font-family: 'JetBrains Mono', monospace;
                font-size: 0.9375rem;
                font-weight: 500;
                background: transparent;
                border: none;
                outline: none;
                color: var(--text-primary, #e8eaed);
                cursor: text;
            "
        >
    </div>

    <!-- ── Dropdown ── -->
    <div id="sb-drop" style="
        display: none;
        position: fixed;
        z-index: 99999;
        background: rgb(10, 17, 32);
        border: 1px solid rgba(0,102,255,0.5);
        border-radius: 0.875rem;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        max-height: 520px;
        overflow-y: auto;
    "></div>

    <!-- ── Quick actions ── -->
    <div class="search-quick-actions">
        <span class="quick-label">Actions populaires:</span>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=AAPL'"><i class="fab fa-apple"></i> AAPL</button>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=MSFT'"><i class="fab fa-microsoft"></i> MSFT</button>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=GOOGL'"><i class="fab fa-google"></i> GOOGL</button>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=TSLA'"><i class="fas fa-car"></i> TSLA</button>
        <button class="quick-stock-btn" onclick="window.location.href='/analyse?ticker=TTE.PA'"><i class="fas fa-gas-pump"></i> TTE</button>
    </div>
</div>

<script>
(function () {
    var input   = document.getElementById('search-input');
    var drop    = document.getElementById('sb-drop');
    var icon    = document.getElementById('sb-icon');
    var wrapper = document.getElementById('search-wrapper');
    if (!input || !drop) return;

    /* Focus highlight */
    input.addEventListener('focus', function () {
        wrapper.style.borderColor = '#0066FF';
        wrapper.style.boxShadow   = '0 0 0 4px rgba(0,102,255,0.12)';
    });
    input.addEventListener('blur', function () {
        setTimeout(function () {
            wrapper.style.borderColor = '';
            wrapper.style.boxShadow   = '';
        }, 150);
    });

    /* Enter → navigate */
    input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            var t = input.value.trim().toUpperCase();
            if (t) window.location.href = '/analyse?ticker=' + t;
        }
    });

    /* Typing → search */
    input.addEventListener('input', function () {
        /* Toggle icon */
        if (input.value.length > 0) {
            icon.style.opacity  = '0';
            icon.style.maxWidth = '0';
            icon.style.padding  = '0';
        } else {
            icon.style.opacity  = '1';
            icon.style.maxWidth = '52px';
            icon.style.padding  = '';
        }

        var q = input.value.trim();
        if (q.length < 2) { closeDrop(); return; }

        clearTimeout(input._t);
        input._t = setTimeout(function () {
            fetch('/api/search?q=' + encodeURIComponent(q))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var items = data.suggestions || [];
                    items.length ? renderDrop(items) : emptyDrop(q);
                })
                .catch(closeDrop);
        }, 260);
    });

    function positionDrop() {
        var rect = wrapper.getBoundingClientRect();
        drop.style.top    = (rect.bottom + 8) + 'px';
        drop.style.left   = rect.left + 'px';
        drop.style.width  = rect.width + 'px';
    }

    function renderDrop(items) {
        positionDrop();
        var html = '<div style="padding:0.4rem 1rem;font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#4b5563;border-bottom:1px solid rgba(255,255,255,0.05);">'
                 + items.length + ' résultat' + (items.length > 1 ? 's' : '') + '</div>';

        items.slice(0, 10).forEach(function (item) {
            var sym  = String(item.symbol || item.ticker || '');
            var name = String(item.name   || '');
            var mkt  = String(item.market || '');
            if (!sym) return;

            var initials   = sym.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase() || sym.slice(0, 2);
            var isEU       = mkt.toUpperCase() === 'EU';
            var badgeStyle = isEU
                ? 'background:rgba(0,217,255,0.12);color:#00d9ff;border:1px solid rgba(0,217,255,0.3);'
                : 'background:rgba(0,102,255,0.14);color:#4d8ff5;border:1px solid rgba(0,102,255,0.3);';

            html += '<div onclick="window.location.href=\'/analyse?ticker=' + encodeURIComponent(sym) + '\'"'
                  + ' style="display:flex;align-items:center;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;"'
                  + ' onmouseover="this.style.background=\'rgba(0,102,255,0.1)\'"'
                  + ' onmouseout="this.style.background=\'transparent\'">'

                  + '<div style="flex-shrink:0;width:44px;height:44px;border-radius:10px;background:rgba(0,102,255,0.14);border:1px solid rgba(0,102,255,0.22);display:flex;align-items:center;justify-content:center;font-family:JetBrains Mono,monospace;font-size:0.8125rem;font-weight:700;color:#4d8ff5;">'
                  + initials + '</div>'

                  + '<div style="flex:1;min-width:0;">'
                  + '<div style="font-family:JetBrains Mono,monospace;font-size:1rem;font-weight:700;color:#e8eaed;line-height:1.2;">' + sym + '</div>'
                  + '<div style="font-size:0.875rem;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + name + '</div>'
                  + '</div>'

                  + '<span style="flex-shrink:0;font-family:JetBrains Mono,monospace;font-size:0.6875rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:5px 12px;border-radius:6px;font-size:0.75rem;' + badgeStyle + '">' + mkt + '</span>'
                  + '<i class="fas fa-chevron-right" style="color:rgba(255,255,255,0.2);font-size:0.75rem;"></i>'
                  + '</div>';
        });

        drop.innerHTML = html;
        drop.style.display = 'block';
    }

    function emptyDrop(q) {
        positionDrop();
        drop.innerHTML = '<div style="padding:1.5rem;text-align:center;color:#6b7280;font-size:0.875rem;">'
                       + '<i class="fas fa-search" style="margin-right:0.5rem;opacity:0.3"></i>'
                       + 'Aucun résultat pour <strong style="color:#9ca3af;">"' + q + '"</strong></div>';
        drop.style.display = 'block';
    }

    function closeDrop() {
        drop.style.display = 'none';
    }

    window.addEventListener('scroll', function() {
        if (drop.style.display !== 'none') positionDrop();
    }, true);
    window.addEventListener('resize', function() {
        if (drop.style.display !== 'none') positionDrop();
    });

    document.addEventListener('click', function (e) {
        var root = document.getElementById('search-bar-root');
        if (root && !root.contains(e.target)) closeDrop();
    });

    input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeDrop();
    });
})();
</script>
