<!-- templates/components/footer.html -->
<footer class="main-footer">
    <div class="footer-container">
        <div class="footer-top">
            <div class="footer-brand">
                <div class="footer-logo">
                    <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
                        <rect width="32" height="32" rx="8" fill="url(#footerGradient)"/>
                        <path d="M8 24L16 8L24 24" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 18H20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="footerGradient" x1="0" y1="0" x2="32" y2="32">
                                <stop offset="0%" stop-color="#0066FF"/>
                                <stop offset="100%" stop-color="#00D9FF"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <div>
                    <h4 class="footer-brand-name">TECHNICAL ANALYST</h4>
                    <p class="footer-brand-tagline">Analyse technique avancée</p>
                </div>
            </div>
            
            <div class="footer-sections">
                <div class="footer-section">
                    <h5 class="footer-section-title">Navigation</h5>
                    <ul class="footer-links">
                        <li><a href="/"><i class="fas fa-home"></i> Accueil</a></li>
                        <li><a href="/analyse"><i class="fas fa-search"></i> Analyse</a></li>
                        <li><a href="/portefeuille"><i class="fas fa-folder"></i> Portefeuille</a></li>
                        <li><a href="/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    </ul>
                </div>
                
                <div class="footer-section">
                    <h5 class="footer-section-title">Support</h5>
                    <ul class="footer-links">
                        <li><a href="#" onclick="contactSupport(); return false;"><i class="fas fa-envelope"></i> Contact</a></li>
                        <li><a href="#" onclick="reportBug(); return false;"><i class="fas fa-bug"></i> Signaler un bug</a></li>
                        <li><a href="#" onclick="showStatus(); return false;"><i class="fas fa-heartbeat"></i> Statut système</a></li>
                        <li><a href="#" onclick="showChangelog(); return false;"><i class="fas fa-history"></i> Changelog</a></li>
                    </ul>
                </div>
            </div>
        </div>
        
        <div class="footer-bottom">
            <div class="footer-bottom-left">
                <p class="footer-copyright">© 2026 Technical Analyst. <span class="separator">•</span> Tous droits réservés.</p>
            </div>
            <div class="footer-bottom-center">
                <a href="#" onclick="showPrivacy(); return false;">Confidentialité</a>
                <span class="separator">•</span>
                <a href="#" onclick="showTerms(); return false;">Conditions</a>
                <span class="separator">•</span>
                <a href="#" onclick="showCookies(); return false;">Cookies</a>
            </div>
            <div class="footer-bottom-right">
                <button class="back-to-top" onclick="scrollToTop()" title="Retour en haut">
                    <i class="fas fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </div>
</footer>

<div class="footer-modal" id="footer-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h4 id="modal-title">Information</h4>
            <button class="modal-close" onclick="closeFooterModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<script>
(function() {
    'use strict';
    window.scrollToTop = function() { window.scrollTo({top: 0, behavior: 'smooth'}); };
    let backToTopBtn = document.querySelector('.back-to-top');
    if (backToTopBtn) {
        window.addEventListener('scroll', function() {
            backToTopBtn.style.opacity = window.pageYOffset > 300 ? '1' : '0';
            backToTopBtn.style.pointerEvents = window.pageYOffset > 300 ? 'all' : 'none';
        });
    }
    const modal = document.getElementById('footer-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalBody = document.getElementById('modal-body');
    function openModal(title, content) {
        modalTitle.textContent = title;
        modalBody.innerHTML = content;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    window.closeFooterModal = function() {
        modal.classList.remove('active');
        document.body.style.overflow = '';
    };
    if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) closeFooterModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('active')) closeFooterModal(); });
    window.contactSupport = function() {
        openModal('Contactez-nous', '<div class="modal-info-content"><p>Notre équipe est là pour vous aider !</p><form onsubmit="sendSupportMessage(event)"><input type="text" placeholder="Votre nom" required><input type="email" placeholder="Votre email" required><textarea placeholder="Votre message..." rows="4" required></textarea><button type="submit" class="btn-primary">Envoyer</button></form></div>');
    };
    window.reportBug = function() {
        openModal('Signaler un bug', '<div class="modal-info-content"><p>Merci de nous aider à améliorer l\'application !</p><form onsubmit="submitBugReport(event)"><input type="text" placeholder="Titre du bug" required><textarea placeholder="Description détaillée..." rows="5" required></textarea><button type="submit" class="btn-primary">Envoyer</button></form></div>');
    };
    window.showStatus = function() {
        openModal('Statut du système', '<div class="modal-info-content"><div class="status-item"><i class="fas fa-check-circle" style="color: var(--green)"></i><span>API: Opérationnel</span></div><div class="status-item"><i class="fas fa-check-circle" style="color: var(--green)"></i><span>Base de données: Opérationnel</span></div><div class="status-item"><i class="fas fa-check-circle" style="color: var(--green)"></i><span>Services de données: Opérationnel</span></div><button class="btn-primary" onclick="closeFooterModal()">Fermer</button></div>');
    };
    window.showChangelog = function() {
        openModal('Historique des versions', '<div class="modal-info-content"><h5>v2.1.0 - 30 Jan 2026</h5><ul><li>Nouvelle interface utilisateur</li><li>Support multi-sources de données</li><li>Performance améliorée</li></ul><button class="btn-primary" onclick="closeFooterModal()">Fermer</button></div>');
    };
    window.showPrivacy = function() {
        openModal('Politique de confidentialité', '<div class="modal-info-content"><p>Nous respectons votre vie privée et protégeons vos données.</p><p>Cette application ne collecte pas de données personnelles sans votre consentement.</p><button class="btn-primary" onclick="closeFooterModal()">Fermer</button></div>');
    };
    window.showTerms = function() {
        openModal('Conditions d\'utilisation', '<div class="modal-info-content"><p>En utilisant Technical Analyst, vous acceptez nos conditions d\'utilisation.</p><p>Ce service est fourni "tel quel" sans garantie.</p><button class="btn-primary" onclick="closeFooterModal()">Fermer</button></div>');
    };
    window.showCookies = function() {
        openModal('Politique des cookies', '<div class="modal-info-content"><p>Nous utilisons des cookies pour améliorer votre expérience.</p><p>Les cookies sont utilisés uniquement pour les préférences utilisateur (thème, etc.).</p><button class="btn-primary" onclick="closeFooterModal()">Fermer</button></div>');
    };
    window.sendSupportMessage = function(e) {
        e.preventDefault();
        openModal('Succès', '<div class="modal-info-content success"><i class="fas fa-check-circle" style="font-size: 3rem; color: var(--green);"></i><h5>Message envoyé !</h5><p>Notre équipe vous répondra dans les plus brefs délais.</p><button class="btn-primary" onclick="closeFooterModal()">Fermer</button></div>');
    };
    window.submitBugReport = function(e) {
        e.preventDefault();
        openModal('Succès', '<div class="modal-info-content success"><i class="fas fa-check-circle" style="font-size: 3rem; color: var(--green);"></i><h5>Rapport envoyé !</h5><p>Merci pour votre contribution à l\'amélioration de l\'application.</p><button class="btn-primary" onclick="closeFooterModal()">Fermer</button></div>');
    };
})();
</script>
